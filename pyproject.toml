[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "learngraph-review"
version = "0.1.0"
description = "LearnGraph task 2: H input review and G grounded lesson review"
requires-python = ">=3.10"
dependencies = [
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
learngraph-review = "learngraph_review.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/learngraph_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
